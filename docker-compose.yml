
services:
  nginx:
    build: ./nginx
    image: nginx
    container_name: nginx_cont
    ports:
      - "8005:80"
    restart: always
    depends_on:
      django_app:
        condition: service_healthy
    networks:
      - notes-app-nw

  django_app:
    image: vipulwani077/notes-app:latest
    container_name: django_cont
    command: >
      sh -c "python manage.py migrate --noinput &&
      gunicorn notesapp.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - notes-app-nw

  db:
    image: mysql:8.4
    container_name: db_cont
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    volumes:
      - ./data/mysql/db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: always
    networks:
      - notes-app-nw

networks:
  notes-app-nw:
    driver: bridge
